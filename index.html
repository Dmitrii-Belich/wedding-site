<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Свадьба">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Свадьба</title>
<style>:root {
  --bg: #f6f1e9;
  --surface: #fffdf9;
  --sunken: #eee7da;
  --text: #2b2722;
  --muted: #7f766a;
  --faint: #b5ab9c;
  --line: #e6ddcf;
  --accent: #8a6a3d;
  --accent-strong: #6b5030;
  --accent-soft: #f1e6d4;
  --ok: #3b7350;
  --ok-soft: #e1eee4;
  --warn: #9c6418;
  --warn-soft: #f7ead4;
  --bad: #ad4335;
  --bad-soft: #f7e0db;
  --info: #3d6585;
  --info-soft: #e1eaf3;
  --shadow: 0 1px 2px rgb(62 46 22 / 5%), 0 6px 20px rgb(62 46 22 / 5%);
  --radius: 18px;
  --serif: ui-serif, 'New York', 'Iowan Old Style', Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --tabbar: 62px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151412;
    --surface: #1e1c19;
    --sunken: #29261f;
    --text: #ece6dc;
    --muted: #a09689;
    --faint: #6c655b;
    --line: #322e28;
    --accent: #d4b27c;
    --accent-strong: #e6c895;
    --accent-soft: #382f23;
    --ok: #84c598;
    --ok-soft: #1e3226;
    --warn: #e2ad5c;
    --warn-soft: #3a2d1a;
    --bad: #ef8c7e;
    --bad-soft: #3e231f;
    --info: #8fb9dc;
    --info-soft: #1e2d3a;
    --shadow: none;
    color-scheme: dark;
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

h1,
h2,
p,
dl,
dd {
  margin: 0;
}

a {
  color: inherit;
}

button {
  font: inherit;
  color: inherit;
}

.page {
  max-width: 640px;
  margin: 0 auto;
  padding: calc(12px + env(safe-area-inset-top)) 16px calc(var(--tabbar) + 36px + env(safe-area-inset-bottom));
  transition: opacity 0.15s;
}

/* Главная */

.hero {
  text-align: center;
  padding: 28px 8px 26px;
}

.eyebrow {
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
}

.names {
  margin-top: 10px;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 36px;
  line-height: 1.1;
  overflow-wrap: anywhere;
}

.amp {
  color: var(--accent);
  font-style: italic;
}

.hero-meta {
  margin-top: 8px;
  color: var(--muted);
  font-size: 15px;
}

.countdown {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.countdown strong {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 64px;
  line-height: 1;
  color: var(--accent);
  font-variant-numeric: lining-nums;
}

.countdown span {
  margin-top: 6px;
  color: var(--muted);
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  text-decoration: none;
}

.stat-label,
.stat-note {
  font-size: 13px;
  color: var(--muted);
}

.stat-value {
  font-family: var(--serif);
  font-size: 30px;
  line-height: 1.15;
  font-variant-numeric: lining-nums;
}

.stat-value small {
  font-size: 18px;
  color: var(--muted);
}

.headcount {
  margin-bottom: 14px;
}

.notice {
  margin-bottom: 10px;
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-size: 14px;
}

/* Разделы */

.page-header {
  padding: 16px 4px 14px;
}

.page-header h1 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 32px;
  line-height: 1.15;
}

.page-header p {
  margin-top: 4px;
  color: var(--muted);
}

.section {
  margin-top: 28px;
}

.section-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 0 4px 10px;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 21px;
  line-height: 1.2;
}

.section-title .count,
.fold .count {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 400;
  color: var(--muted);
}

.section-title .aside {
  margin-left: auto;
  font-family: var(--sans);
  font-size: 14px;
  color: var(--muted);
  white-space: nowrap;
}

.section-title .aside a {
  color: var(--accent);
  text-decoration: none;
}

.section-title.tone-bad {
  color: var(--bad);
}

.list {
  list-style: none;
  margin: 0;
  padding: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
}

.row + .row,
.change + .change {
  border-top: 1px solid var(--line);
}

.row-main {
  flex: 1;
  min-width: 0;
}

.row-link {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
}

.row-title {
  font-weight: 500;
  overflow-wrap: anywhere;
}

.row-title .pill {
  margin-left: 8px;
  vertical-align: 1px;
}

.row-title .companion {
  font-weight: 400;
  color: var(--muted);
}

.row > .pill {
  margin-top: 2px;
}

.closed .row-title {
  color: var(--muted);
  font-weight: 400;
  text-decoration: line-through;
  text-decoration-color: var(--faint);
}

/* Разделитель стоит перед каждым элементом; тот, что оказался в начале строки, срезается clip-path. */
.meta {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  margin: 3px 0 0 -14px;
  clip-path: inset(-4px 0 -4px 14px);
  font-size: 14px;
  color: var(--muted);
}

.meta > *::before {
  content: '·';
  display: inline-block;
  width: 14px;
  text-align: center;
  color: var(--faint);
}

.meta a,
.notes a {
  color: var(--accent);
  text-decoration: none;
}

.notes {
  margin-top: 6px;
  font-size: 14px;
  color: var(--muted);
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.notes-flat {
  margin-top: 0;
}

.due.tone-bad,
.tone-bad {
  color: var(--bad);
}

.due.tone-warn,
.tone-warn {
  color: var(--warn);
}

.tone-ok {
  color: var(--ok);
}

.pill {
  display: inline-flex;
  align-items: center;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.5;
  white-space: nowrap;
  background: var(--sunken);
  color: var(--muted);
}

.pill-ok {
  background: var(--ok-soft);
  color: var(--ok);
}

.pill-warn {
  background: var(--warn-soft);
  color: var(--warn);
}

.pill-bad {
  background: var(--bad-soft);
  color: var(--bad);
}

.pill-info {
  background: var(--info-soft);
  color: var(--info);
}

.pill-accent {
  background: var(--accent-soft);
  color: var(--accent-strong);
}

.empty {
  padding: 28px 20px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: var(--radius);
}

.empty .hint {
  margin-top: 6px;
  font-size: 14px;
}

.fold {
  margin-top: 28px;
}

.fold > summary {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 0 4px 10px;
  list-style: none;
  cursor: pointer;
  font-family: var(--serif);
  font-size: 19px;
  color: var(--muted);
}

.fold > summary::-webkit-details-marker {
  display: none;
}

.fold > summary::after {
  content: '›';
  margin-left: auto;
  font-family: var(--sans);
  transition: transform 0.2s;
}

.fold[open] > summary::after {
  transform: rotate(90deg);
}

/* Фильтры */

.chips {
  display: flex;
  gap: 8px;
  margin: 0 -16px;
  padding: 2px 16px 4px;
  overflow-x: auto;
  scrollbar-width: none;
}

.chips::-webkit-scrollbar {
  display: none;
}

.chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 13px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-size: 14px;
  cursor: pointer;
}

.chip.active {
  background: var(--text);
  border-color: var(--text);
  color: var(--bg);
}

.chip-count {
  font-size: 13px;
  color: var(--muted);
}

.chip.active .chip-count {
  color: inherit;
  opacity: 0.7;
}

.segmented {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 2px;
  margin-top: 12px;
  padding: 3px;
  border-radius: 12px;
  background: var(--sunken);
}

.segmented button {
  padding: 7px 4px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  font-size: 14px;
  color: var(--muted);
  cursor: pointer;
}

.segmented button.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow);
}

.search {
  width: 100%;
  margin-top: 12px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 16px;
  appearance: none;
}

.search:focus,
.input:focus {
  outline: 2px solid var(--accent-soft);
  border-color: var(--accent);
}

.facts {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin: 12px 4px 0;
  font-size: 14px;
  color: var(--muted);
}

.facts strong {
  color: var(--text);
  font-weight: 600;
}

/* Бюджет */

.card {
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.summary-main {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 8px;
}

.summary-label {
  width: 100%;
  font-size: 13px;
  color: var(--muted);
}

.summary-main strong {
  font-family: var(--serif);
  font-size: 30px;
  font-weight: 500;
  font-variant-numeric: lining-nums;
}

.summary-of {
  color: var(--muted);
}

.meter {
  height: 8px;
  margin: 12px 0 14px;
  border-radius: 99px;
  background: var(--sunken);
  overflow: hidden;
}

.meter > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--accent);
}

.summary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 16px;
}

.summary-grid dt {
  font-size: 13px;
  color: var(--muted);
}

.summary-grid dd {
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.amount {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  font-size: 13px;
  color: var(--muted);
  text-align: right;
  white-space: nowrap;
}

.amount strong {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

/* Тайминг */

.timeline {
  list-style: none;
  margin: 0;
  padding: 0;
}

.timeline li {
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: 12px;
}

.timeline time {
  padding-top: 1px;
  font-family: var(--serif);
  font-size: 18px;
  color: var(--accent);
  text-align: right;
  font-variant-numeric: tabular-nums lining-nums;
}

.slot {
  position: relative;
  padding: 0 0 22px 18px;
  border-left: 1px solid var(--line);
}

.timeline li:last-child .slot {
  border-left-color: transparent;
}

.slot::before {
  content: '';
  position: absolute;
  left: -5px;
  top: 8px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
}

/* Изменения */

.change {
  padding: 12px 16px;
}

.change-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.change-subject {
  flex: 1;
  min-width: 0;
  font-weight: 500;
  overflow-wrap: anywhere;
}

.change time {
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
}

.change-lines {
  list-style: none;
  margin: 6px 0 0;
  padding: 0;
  font-size: 14px;
  color: var(--muted);
}

.change-lines li {
  overflow-wrap: anywhere;
}

.change-section {
  margin-right: 6px;
  color: var(--faint);
}

.footer {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 14px;
  margin-top: 36px;
  font-size: 13px;
  color: var(--muted);
}

.link-button {
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent);
  font-size: 13px;
  cursor: pointer;
}

/* Установка */

.install {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 14px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.app-icon {
  flex: none;
  width: 48px;
  height: 48px;
}

.install-main {
  flex: 1;
  min-width: 0;
}

.install-title {
  font-weight: 600;
}

.install-hint {
  margin-top: 2px;
  font-size: 14px;
  color: var(--muted);
}

.install-actions {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 10px;
}

.install-actions .button {
  padding: 8px 16px;
  border-radius: 12px;
  font-size: 15px;
}

.install-actions .link-button {
  font-size: 14px;
}

/* Навигация */

.tabbar {
  position: fixed;
  z-index: 10;
  left: 0;
  right: 0;
  bottom: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 84%, transparent);
  -webkit-backdrop-filter: saturate(1.6) blur(18px);
  backdrop-filter: saturate(1.6) blur(18px);
}

.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px 0;
  font-size: 11px;
  color: var(--muted);
  text-decoration: none;
}

.tab svg {
  width: 24px;
  height: 24px;
}

.tab.active {
  color: var(--accent);
}

@media (min-width: 700px) {
  .tabbar {
    left: 50%;
    right: auto;
    bottom: 16px;
    width: 520px;
    padding-bottom: 6px;
    transform: translateX(-50%);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
  }
}

/* Пароль */

.lock {
  display: grid;
  place-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 24px 16px;
}

.lock-card {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 360px;
  text-align: center;
}

.lock-card svg {
  width: 64px;
  height: 64px;
  margin: 0 auto;
  color: var(--accent);
}

.lock-card h1 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 32px;
}

.lock-hint {
  color: var(--muted);
  font-size: 15px;
}

.input,
.button {
  width: 100%;
  padding: 13px 16px;
  border-radius: 14px;
  font: inherit;
  font-size: 16px;
}

.input {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
}

.button {
  border: 0;
  background: var(--text);
  color: var(--bg);
  font-weight: 600;
  cursor: pointer;
}

.button:disabled {
  opacity: 0.5;
}

.error {
  color: var(--bad);
  font-size: 14px;
}

.fatal {
  padding: 48px 16px;
  text-align: center;
  color: var(--bad);
}

/* Правка */

.page-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.add-button {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 7px 14px 7px 10px;
  border: 0;
  border-radius: 999px;
  background: var(--text);
  color: var(--bg);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.add-button svg,
.icon-button svg,
.check svg {
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.add-button svg {
  width: 18px;
  height: 18px;
  stroke-width: 2.2;
}

.editable {
  cursor: pointer;
  transition: background-color 0.15s;
}

.editable:active,
.editable:focus-visible {
  background: var(--sunken);
  outline: none;
}

@media (hover: hover) {
  .editable:hover {
    background: color-mix(in srgb, var(--sunken) 55%, transparent);
  }
}

.moment.editable {
  border-radius: 12px;
}

.check {
  flex: none;
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  margin-top: -1px;
  padding: 0;
  border: 1.5px solid var(--faint);
  border-radius: 50%;
  background: transparent;
  color: transparent;
  cursor: pointer;
}

.check svg {
  width: 16px;
  height: 16px;
  stroke-width: 2.4;
}

.check.checked {
  border-color: var(--ok);
  background: var(--ok);
  color: var(--surface);
}

.pill-button {
  flex: none;
  margin-top: 2px;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
}

.hero-edit {
  margin-top: 6px;
  font-size: 14px;
}

/* Шторка с формой */

html:has(.sheet[open]) {
  overflow: hidden;
}

.sheet {
  width: 100%;
  max-width: none;
  height: 100%;
  max-height: none;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--text);
  overflow: hidden;
}

.sheet[open] {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
}

.sheet::backdrop {
  background: rgb(20 16 10 / 45%);
}

.sheet-panel {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 560px;
  max-height: calc(100% - 24px - env(safe-area-inset-top));
  border-radius: 22px 22px 0 0;
  background: var(--surface);
  box-shadow: 0 -8px 40px rgb(0 0 0 / 18%);
  overflow: hidden;
  animation: sheet-in 0.22s ease-out;
}

@keyframes sheet-in {
  from {
    transform: translateY(24px);
    opacity: 0;
  }
}

@media (min-width: 700px) {
  .sheet[open] {
    justify-content: center;
  }

  .sheet-panel {
    max-height: min(86vh, 900px);
    border-radius: 22px;
  }
}

.sheet-head {
  display: flex;
  align-items: center;
  gap: 12px;
